<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Domain ID Matcher</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 50px auto;
        padding: 20px;
    }

    textarea {
        width: 100%;
        height: 120px;
        padding: 10px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }

    pre {
        background: #f4f4f4;
        padding: 15px;
        margin-top: 20px;
        border-radius: 5px;
    }
</style>

</head> <body>
<h1>Domain ID Matcher</h1>

<p>Enter names, one per line:</p>

<textarea id="namesInput">admin


aerlingus</textarea>

<br>

<button onclick="findIds()">Find IDs</button>

<h3>Result:</h3>

<pre id="result">[]</pre>

<script>
    async function findIds() {
        try {
            // Load data.json
            const response = await fetch("data.json");

            if (!response.ok) {
                throw new Error("Could not load data.json");
            }

            const data = await response.json();

            // Get names from textarea
            const names = document
                .getElementById("namesInput")
                .value
                .split(/\r?\n/)
                .map(name => name.trim().toLowerCase())
                .filter(Boolean);

            // Match names against domain
            const ids = data
                .filter(item => names.includes(item.domain.toLowerCase()))
                .map(item => item.id);

            // Display result
            document.getElementById("result").textContent =
                JSON.stringify(ids, null, 2);

        } catch (error) {
            document.getElementById("result").textContent =
                "Error: " + error.message;
        }
    }
</script>

</body> </html>
