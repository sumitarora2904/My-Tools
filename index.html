<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unique Pair Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6fa;
        color: #1f2937;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 25px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
        margin-top: 0;
        text-align: center;
        color: #2563eb;
    }

    .description {
        text-align: center;
        color: #6b7280;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    textarea {
        width: 100%;
        min-height: 220px;
        resize: vertical;
        padding: 15px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-family: monospace;
        font-size: 15px;
        outline: none;
    }

    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .generate {
        background: #2563eb;
        color: white;
        flex: 1;
    }

    .generate:hover {
        background: #1d4ed8;
    }

    .clear {
        background: #dc2626;
        color: white;
    }

    .copy {
        background: #16a34a;
        color: white;
    }

    .download {
        background: #7c3aed;
        color: white;
    }

    .stats {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }

    .stat {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 15px 20px;
        flex: 1;
        text-align: center;
    }

    .stat-number {
        display: block;
        font-size: 25px;
        font-weight: bold;
        color: #2563eb;
    }

    .stat-label {
        color: #64748b;
        font-size: 14px;
    }

    .results {
        margin-top: 25px;
    }

    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 10px;
    }

    .results-header h2 {
        margin: 0;
    }

    .pair-list {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        overflow: hidden;
    }

    .pair {
        display: grid;
        grid-template-columns: 60px 1fr;
        padding: 12px 15px;
        border-bottom: 1px solid #e5e7eb;
        background: white;
    }

    .pair:last-child {
        border-bottom: none;
    }

    .pair:nth-child(even) {
        background: #f8fafc;
    }

    .pair-number {
        color: #64748b;
        font-weight: bold;
    }

    .value {
        display: inline-block;
        font-family: monospace;
        font-size: 15px;
        font-weight: bold;
        color: #2563eb;
        cursor: pointer;
        padding: 5px 8px;
        border-radius: 5px;
        transition: 0.15s;
    }

    .value:hover {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .value:active {
        background: #93c5fd;
    }

    .separator {
        color: #64748b;
        margin: 0 5px;
    }

    .empty {
        text-align: center;
        padding: 30px;
        color: #94a3b8;
    }

    .toast {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #16a34a;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s ease;
        z-index: 9999;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
        .container {
            margin: 15px;
            padding: 0;
        }

        .card {
            padding: 18px;
        }

        .buttons {
            flex-direction: column;
        }

        button {
            width: 100%;
        }

        .results-header {
            flex-direction: column;
            align-items: stretch;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Unique Pair Generator</h1>

        <div class="description">
            Enter your values below — one value per line.
        </div>

        <label for="inputValues">
            Values
        </label>

        <textarea
            id="inputValues"
            placeholder="AER0028
AER0027
AER0049
AER0050"></textarea>

        <div class="buttons">

            <button class="generate" onclick="generatePairs()">
                Generate Unique Pairs
            </button>

            <button class="clear" onclick="clearAll()">
                Clear
            </button>

        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-number" id="valueCount">0</span>
                <span class="stat-label">Unique Values</span>
            </div>

            <div class="stat">
                <span class="stat-number" id="pairCount">0</span>
                <span class="stat-label">Unique Pairs</span>
            </div>

        </div>

        <div class="results">

            <div class="results-header">

                <h2>Pairs</h2>

                <div>
                    <button class="copy" onclick="copyPairs()">
                        Copy Pairs
                    </button>

                    <button class="download" onclick="downloadCSV()">
                        Download CSV
                    </button>
                </div>

            </div>

            <div id="results" class="pair-list">

                <div class="empty">
                    Enter values and click "Generate Unique Pairs".
                </div>

            </div>

        </div>

    </div>

</div>

<div id="toast" class="toast">
    Copied!
</div>


<script>

let generatedPairs = [];


/* Get unique values */
function getValues() {

    const input =
        document.getElementById("inputValues").value;

    const values = input
        .split(/[\n\r\t,]+/)
        .map(value => value.trim())
        .filter(value => value !== "");

    return [...new Set(values)];
}


/* Generate all unique pairs */
function generatePairs() {

    const values = getValues();

    generatedPairs = [];

    document.getElementById("valueCount").textContent =
        values.length;

    if (values.length < 2) {

        document.getElementById("pairCount").textContent = "0";

        document.getElementById("results").innerHTML = `
            <div class="empty">
                Please enter at least 2 unique values.
            </div>
        `;

        return;
    }


    for (let i = 0; i < values.length; i++) {

        for (let j = i + 1; j < values.length; j++) {

            generatedPairs.push([
                values[i],
                values[j]
            ]);

        }

    }


    document.getElementById("pairCount").textContent =
        generatedPairs.length;

    displayPairs();
}


/* Display pairs */
function displayPairs() {

    const results =
        document.getElementById("results");

    results.innerHTML = "";


    generatedPairs.forEach((pair, index) => {

        const row =
            document.createElement("div");

        row.className = "pair";


        row.innerHTML = `

            <div class="pair-number">
                ${index + 1}
            </div>

            <div>

                <span
                    class="value"
                    onclick="copySingleValue('${escapeJS(pair[0])}')"
                    title="Click to copy">
                    ${escapeHTML(pair[0])}
                </span>

                <span class="separator">
                    —
                </span>

                <span
                    class="value"
                    onclick="copySingleValue('${escapeJS(pair[1])}')"
                    title="Click to copy">
                    ${escapeHTML(pair[1])}
                </span>

            </div>
        `;


        results.appendChild(row);

    });

}


/* Copy ONLY the clicked value */
function copySingleValue(value) {

    navigator.clipboard.writeText(value)
        .then(() => {

            showToast(value + " copied!");

        })
        .catch(() => {

            const temp =
                document.createElement("textarea");

            temp.value = value;

            document.body.appendChild(temp);

            temp.select();

            document.execCommand("copy");

            document.body.removeChild(temp);

            showToast(value + " copied!");

        });
}


/* Copy all pairs */
function copyPairs() {

    if (generatedPairs.length === 0) {

        alert("Generate pairs first.");

        return;
    }


    const text = generatedPairs
        .map(pair =>
            `${pair[0]} - ${pair[1]}`
        )
        .join("\n");


    navigator.clipboard.writeText(text)
        .then(() => {

            showToast("All pairs copied!");

        });

}


/* Download CSV */
function downloadCSV() {

    if (generatedPairs.length === 0) {

        alert("Generate pairs first.");

        return;
    }


    let csv =
        "Pair Number,Value 1,Value 2\n";


    generatedPairs.forEach((pair, index) => {

        csv +=
            `${index + 1},"${pair[0]}","${pair[1]}"\n`;

    });


    const blob = new Blob(
        [csv],
        {
            type: "text/csv;charset=utf-8;"
        }
    );


    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "Unique_Pairs.csv";

    link.click();

    URL.revokeObjectURL(url);
}


/* Clear everything */
function clearAll() {

    document.getElementById("inputValues").value = "";

    document.getElementById("valueCount").textContent = "0";

    document.getElementById("pairCount").textContent = "0";

    generatedPairs = [];

    document.getElementById("results").innerHTML = `
        <div class="empty">
            Enter values and click "Generate Unique Pairs".
        </div>
    `;
}


/* Toast message */
function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    }, 1500);
}


/* Prevent HTML injection */
function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


/* Escape value for onclick */
function escapeJS(value) {

    return value
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

</script>

</body>
</html>
