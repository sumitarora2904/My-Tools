<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Match & Filter Tool</title>
<style>
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
    }
    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 500px;
    }
    h2 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.5rem;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
    }
    input[type="text"], textarea, input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
    }
    textarea {
        resize: vertical;
    }
    button {
        width: 100%;
        padding: 12px;
        background-color: #0066cc;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
    }
    button:hover {
        background-color: #0052a3;
    }
</style>
</head>
<body>

<div class="container">
    <h2>CSV Filter Tool</h2>
    
    <div class="form-group">
        <label for="csvFileInput">1. Upload your CSV file</label>
        <input type="file" id="csvFileInput" accept=".csv, .txt">
    </div>

    <div class="form-group">
        <label for="empArrayInput">2. Employee Numbers (one per line)</label>
        <textarea id="empArrayInput" rows="6" placeholder="GB450001&#10;GB450653&#10;GB450004"></textarea>
    </div>

    <div class="form-group">
        <label for="clientNameInput">3. Client Name</label>
        <input type="text" id="clientNameInput" placeholder="Enter client name">
    </div>

    <button onclick="processAndDownload()">Process and Download CSV</button>
</div>

<script>
function normalizeStr(val) {
    if (val === null || val === undefined) return "";
    return String(val)
        .replace(/^\uFEFF/, '')
        .replace(/[\u200B-\u200D\uFEFF]/g, '')
        .trim()
        .replace(/^["']+|["']+$/g, '')
        .trim()
        .toLowerCase();
}

function detectDelimiter(firstLine) {
    const commas = (firstLine.match(/,/g) || []).length;
    const semicolons = (firstLine.match(/;/g) || []).length;
    const tabs = (firstLine.match(/\t/g) || []).length;

    if (semicolons > commas && semicolons > tabs) return ';';
    if (tabs > commas && tabs > semicolons) return '\t';
    return ',';
}

function parseCSVLine(line, delimiter) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"' && line[i+1] === '"') {
            current += '"';
            i++;
        } else if (char === '"') {
            inQuotes = !inQuotes;
        } else if (char === delimiter && !inQuotes) {
            result.push(current);
            current = '';
        } else {
            current += char;
        }
    }
    result.push(current);
    return result;
}

function formatCSVLine(rowArray) {
    return rowArray.map(field => {
        const str = String(field ?? "");
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
            return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
    }).join(',');
}

function triggerDownload(csvContent, filename) {
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", filename);
    link.style.visibility = 'hidden';
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function processAndDownload() {
    const fileInput = document.getElementById('csvFileInput');
    const empArrayText = document.getElementById('empArrayInput').value;
    const clientName = document.getElementById('clientNameInput').value.trim();

    if (!fileInput.files.length) {
        alert("Please select a CSV file first.");
        return;
    }

    if (!empArrayText.trim()) {
        alert("Please enter at least one Employee Number.");
        return;
    }

    const empSet = new Set(
        empArrayText.split(/\r?\n/)
            .map(e => normalizeStr(e))
            .filter(e => e.length > 0)
    );

    const reader = new FileReader();
    
    reader.onload = function(event) {
        let fileContent = event.target.result;
        
        if (fileContent.charCodeAt(0) === 0xFEFF) {
            fileContent = fileContent.slice(1);
        }

        const lines = fileContent.split(/\r?\n/).filter(line => line.trim() !== "");
        
        if (lines.length === 0) {
            alert("The uploaded CSV is empty.");
            return;
        }

        const delimiter = detectDelimiter(lines[0]);
        const headers = parseCSVLine(lines[0], delimiter);

        const possibleHeaderPatterns = [
            'employeeno', 'employee_no', 'emp_no', 'empno', 
            'employee id', 'employee_id', 'empid', 'emp id',
            'employee code', 'emp_code', 'empcode', 'staff no', 'staff id'
        ];

        let empIndex = headers.findIndex(h => {
            const clean = normalizeStr(h).replace(/[^a-z0-9]/g, '');
            return possibleHeaderPatterns.some(pat => pat.replace(/[^a-z0-9]/g, '') === clean);
        });

        if (empIndex === -1) {
            alert(
                "Could not find the Employee Number column.\n\n" +
                "Detected Delimiter: " + (delimiter === '\t' ? 'TAB' : delimiter) + "\n" +
                "Found Columns: \n" + headers.map((h, i) => `[${i}] "${h}"`).join('\n')
            );
            return;
        }

        const outputHeaders = [...headers.map(h => normalizeStr(h))];
        outputHeaders.unshift("client_name");

        const outputLines = [formatCSVLine(outputHeaders)];
        const sampleExtractedValues = [];

        for (let i = 1; i < lines.length; i++) {
            const rowData = parseCSVLine(lines[i], delimiter);
            const rawEmpNo = rowData[empIndex];
            const currentEmpNo = normalizeStr(rawEmpNo);

            if (sampleExtractedValues.length < 5 && currentEmpNo) {
                sampleExtractedValues.push(currentEmpNo);
            }

            if (empSet.has(currentEmpNo)) {
                rowData.unshift(clientName);
                outputLines.push(formatCSVLine(rowData));
            }
        }

        if (outputLines.length === 1) {
            const inputTargets = Array.from(empSet).slice(0, 5).join(', ');
            const foundSamples = sampleExtractedValues.join(', ') || 'none detected';
            alert(
                "No matching employee numbers were found.\n\n" +
                "Column targeted: \"" + headers[empIndex] + "\" (Index: " + empIndex + ")\n" +
                "Looking for (first few): [" + inputTargets + "]\n" +
                "Values read from CSV (first few): [" + foundSamples + "]\n\n" +
                "Compare these two sets to check for formatting differences."
            );
            return;
        }

        const finalCSVContent = outputLines.join("\n");
        triggerDownload(finalCSVContent, "processed_employees.csv");
    };

    reader.readAsText(fileInput.files[0]);
}
</script>
</body>
</html>
